<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flutlicht Fußballmanager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"><div class="start"><div class="start-in"><h1 class="title">Flutlicht<span>Fußballmanager</span></h1><p>Das Spiel wird geladen …</p></div></div></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">Dieses Spiel benötigt JavaScript.</p></noscript>
<script src="js/core.js"></script>
<script src="js/gen.js"></script>
<script src="js/cal.js"></script>
<script src="js/team.js"></script>
<script src="js/econ.js"></script>
<script src="js/match.js"></script>
<script src="js/transfer.js"></script>
<script src="js/events.js"></script>
<script src="js/euro.js"></script>
<script src="js/game.js"></script>
<script src="js/world.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-team.js"></script>
<script src="js/ui-club.js"></script>
<script src="js/ui-match.js"></script>
<script>
(function () {
  var UI = window.FM.UI;
  function start(data) { UI.boot(data || {}); }
  try {
    var hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) hot.snapshot(function () { return UI.snapshot(); });
    if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
  } catch (e) { start({}); }
  window.addEventListener('beforeunload', function () { if (UI.world && !UI.live) UI.autosave(); });
})();
</script>
</body>
</html>
